identity:
  author: "acedatacloud"
  name: "qwen_image"
  label:
    en_US: "Qwen Image"
    zh_Hans: "Qwen Image"
    pt_BR: "Qwen Image"
    ja_JP: "Qwen Image"
  description:
    en_US: "Generate and edit images via Ace Data Cloud Qwen Image API."
    zh_Hans: "通过 Ace Data Cloud Qwen Image API 生成与编辑图片。"
    pt_BR: "Gere e edite imagens via Ace Data Cloud Qwen Image API."
    ja_JP: "Ace Data Cloud Qwen Image API を使って画像生成・編集を行います。"
  icon: "icon.jpg"
  icon_dark: "icon.jpg"
  tags:
    - image

credentials_for_provider:
  acedata_bearer_token:
    type: secret-input
    required: true
    label:
      en_US: Ace Data Cloud Bearer Token
      zh_Hans: Ace Data Cloud Token
    placeholder:
      en_US: Paste your token (without "Bearer ")
      zh_Hans: 粘贴 Token（不需要带 Bearer）
    help:
      en_US: Acquire a token from the Ace Data Cloud console.
      zh_Hans: 从 Ace Data Cloud 控制台获取 Token。
    url: https://platform.acedata.cloud/documents/qwen-image-images

tools:
  - tools/qwen_image.yaml

extra:
  python:
    source: provider/qwen_image.py

