identity:
  name: midjourney_imagine
  author: acedatacloud
  label:
    en_US: Midjourney Imagine
    zh_Hans: Midjourney 文生图/变换
description:
  human:
    en_US: Generate or transform images via Ace Data Cloud Midjourney Imagine API.
    zh_Hans: 通过 Ace Data Cloud Midjourney Imagine API 进行文生图与图片变换。
  llm: Generate or transform an image with Midjourney Imagine API.
output_schema:
  type: object
  properties:
    success: { type: boolean }
    error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
    task_id: { type: string }
    trace_id: { type: string }
    data:
      type: object
      additionalProperties: true
parameters:
  - name: prompt
    type: string
    required: false
    label: { en_US: Prompt, zh_Hans: 提示词 }
    human_description:
      en_US: Text prompt used to generate the image (required when action=generate).
      zh_Hans: 生成图片的提示词（action=generate 时必填）。
    llm_description: Describe the image you want to generate.
    form: llm
  - name: action
    type: string
    required: false
    label: { en_US: Action, zh_Hans: 操作 }
    human_description:
      en_US: Operation action. Default is generate; e.g. upscale1/variation2/zoom_out_2x.
      zh_Hans: 操作类型，默认 generate，也可填 upscale1/variation2/zoom_out_2x 等。
    llm_description: Optional. Use generate for first run, otherwise pass an action from the previous result.
    form: form
  - name: image_id
    type: string
    required: false
    label: { en_US: Image ID, zh_Hans: 图片ID }
    human_description:
      en_US: Required when action is not generate.
      zh_Hans: action 非 generate 时必填。
    llm_description: The image_id from a previous result.
    form: form
  - name: mode
    type: select
    required: false
    label: { en_US: Mode, zh_Hans: 模式 }
    human_description:
      en_US: Generation mode.
      zh_Hans: 生成模式。
    llm_description: Optional. fast/relax/turbo.
    form: form
    options:
      - value: fast
        label: { en_US: fast (default), zh_Hans: fast（默认） }
      - value: relax
        label: { en_US: relax, zh_Hans: relax }
      - value: turbo
        label: { en_US: turbo, zh_Hans: turbo }
  - name: timeout
    type: number
    required: false
    label: { en_US: Timeout (s), zh_Hans: 超时秒数 }
    human_description:
      en_US: Request timeout for the Imagine API.
      zh_Hans: Imagine 接口的超时秒数。
    llm_description: Optional. Integer seconds.
    form: form
  - name: translation
    type: boolean
    required: false
    label: { en_US: Auto translate, zh_Hans: 自动翻译 }
    human_description:
      en_US: Auto translate non-English prompt.
      zh_Hans: 自动翻译非英文提示词。
    llm_description: Optional boolean.
    form: form
  - name: split_images
    type: boolean
    required: false
    label: { en_US: Split 2x2, zh_Hans: 拆分2x2 }
    human_description:
      en_US: Split a 2x2 grid into single images when supported.
      zh_Hans: 将 2x2 预览图拆分为单张（如支持）。
    llm_description: Optional boolean.
    form: form
  - name: mask
    type: string
    required: false
    label: { en_US: Mask URL, zh_Hans: 蒙版链接 }
    human_description:
      en_US: Optional mask image URL for variation_region action.
      zh_Hans: 可选蒙版图片链接，用于 variation_region 操作。
    llm_description: Optional. Provide a mask image URL when action is variation_region.
    form: form
  - name: callback_url
    type: string
    required: false
    label: { en_US: Callback URL, zh_Hans: 回调地址 }
    human_description:
      en_US: Async callback URL (optional).
      zh_Hans: 异步回调地址（可选）。
    llm_description: Optional.
    form: form
  - name: version
    type: select
    required: false
    label: { en_US: Version, zh_Hans: 版本 }
    human_description:
      en_US: Midjourney model version. V8 is the latest with HD and quality 4 support.
      zh_Hans: Midjourney 模型版本。V8 为最新版本，支持 HD 和 quality 4。
    llm_description: Optional. Model version string, e.g. "8", "7", "6.1".
    form: form
    options:
      - value: "8"
        label: { en_US: "8 (Alpha)", zh_Hans: "8（Alpha）" }
      - value: "7"
        label: { en_US: "7", zh_Hans: "7" }
      - value: "6.1"
        label: { en_US: "6.1", zh_Hans: "6.1" }
      - value: "6"
        label: { en_US: "6", zh_Hans: "6" }
  - name: hd
    type: boolean
    required: false
    label: { en_US: HD Mode, zh_Hans: HD 高清 }
    human_description:
      en_US: Enable HD mode for 2K resolution output (V8 only, costs 4x).
      zh_Hans: 启用 HD 高清模式输出 2K 分辨率图像（仅 V8，消耗 4 倍积分）。
    llm_description: Optional. V8 only. Enable HD for 2K resolution images.
    form: form
  - name: quality
    type: select
    required: false
    label: { en_US: Quality, zh_Hans: 画质 }
    human_description:
      en_US: Image quality level.
      zh_Hans: 图像画质等级。
    llm_description: Optional. Quality level. "4" is ultra detail (V8 only, costs 4x).
    form: form
    options:
      - value: "1"
        label: { en_US: "1 (default)", zh_Hans: "1（默认）" }
      - value: ".5"
        label: { en_US: "0.5 (medium)", zh_Hans: "0.5（中等）" }
      - value: ".25"
        label: { en_US: "0.25 (low)", zh_Hans: "0.25（低）" }
      - value: "4"
        label: { en_US: "4 (ultra, V8 only)", zh_Hans: "4（超清，仅 V8）" }
  - name: style_reference
    type: boolean
    required: false
    label: { en_US: Style Reference, zh_Hans: 风格参考 }
    human_description:
      en_US: Whether the prompt uses --sref style references (V8 premium feature).
      zh_Hans: 提示词是否使用了 --sref 风格参考（V8 高级特性）。
    llm_description: Optional. Set true if the prompt contains --sref parameter.
    form: form
  - name: moodboard
    type: boolean
    required: false
    label: { en_US: Moodboard, zh_Hans: 情绪板 }
    human_description:
      en_US: Whether using moodboard mode with multiple reference images (V8 premium feature).
      zh_Hans: 是否使用多参考图的情绪板模式（V8 高级特性）。
    llm_description: Optional. Set true when blending multiple reference images as a moodboard.
    form: form
  - name: application_id
    type: string
    required: false
    label: { en_US: Application ID, zh_Hans: 应用ID }
    human_description:
      en_US: Optional application_id for attribution.
      zh_Hans: 可选 application_id，用于归因。
    llm_description: Optional.
    form: form
extra:
  python:
    source: tools/midjourney_imagine.py
