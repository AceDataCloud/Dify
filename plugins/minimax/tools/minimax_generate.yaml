identity:
  name: minimax_generate_video
  author: acedatacloud
  label:
    en_US: MiniMax H3 Generate Video
    zh_Hans: MiniMax H3 生成视频
description:
  human:
    en_US: Generate MiniMax H3 video from text, images, or audio guidance.
    zh_Hans: 使用文本、图片或音频引导生成 MiniMax H3 视频。
  llm: Generate a 4-15 second MiniMax H3 video at 768P or 2K. Prompt is required; audio also requires images.
output_schema:
  type: object
  properties:
    success: { type: boolean }
    error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
    task_id: { type: string }
    trace_id: { type: string }
    data:
      type: array
      items:
        type: object
        additionalProperties: true
parameters:
  - name: content
    type: array
    required: true
    label: { en_US: Content, zh_Hans: 内容 }
    human_description:
      en_US: Ordered MiniMax H3 V2 text, image, video, and audio content items.
      zh_Hans: 按顺序排列的 MiniMax H3 V2 文本、图片、视频和音频内容项。
    llm_description: Must include one non-empty text item. Media URLs use nested objects such as {"type":"image_url","image_url":{"url":"https://..."},"role":"reference_image"}.
    form: llm
    input_schema:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        properties:
          type: { type: string, enum: [text, image_url, video_url, audio_url] }
          text: { type: string }
          image_url:
            type: object
            properties: { url: { type: string } }
            required: [url]
            additionalProperties: false
          video_url:
            type: object
            properties: { url: { type: string } }
            required: [url]
            additionalProperties: false
          audio_url:
            type: object
            properties: { url: { type: string } }
            required: [url]
            additionalProperties: false
          role: { type: string, enum: [first_frame, last_frame, reference_image, reference_video, reference_audio] }
        required: [type]
  - name: resolution
    type: select
    required: false
    default: "2K"
    label: { en_US: Resolution, zh_Hans: 分辨率 }
    human_description: { en_US: Output resolution., zh_Hans: 输出视频分辨率。 }
    llm_description: Choose 768P or 2K. Default is 2K.
    form: form
    options:
      - value: "768P"
        label: { en_US: "768P", zh_Hans: "768P" }
      - value: "2K"
        label: { en_US: "2K", zh_Hans: "2K" }
  - name: ratio
    type: select
    required: false
    default: "16:9"
    label: { en_US: Aspect Ratio, zh_Hans: 宽高比 }
    human_description: { en_US: Output aspect ratio., zh_Hans: 输出视频宽高比。 }
    llm_description: Choose 16:9 or 9:16.
    form: form
    options:
      - value: "16:9"
        label: { en_US: "16:9", zh_Hans: "16:9" }
      - value: "9:16"
        label: { en_US: "9:16", zh_Hans: "9:16" }
  - name: duration
    type: number
    required: false
    default: 4
    min: 4
    max: 15
    label: { en_US: Duration, zh_Hans: 时长 }
    human_description: { en_US: Integer duration from 4 to 15 seconds., zh_Hans: 4–15 秒整数时长。 }
    llm_description: Integer from 4 to 15 seconds.
    form: form
  - name: callback_url
    type: string
    required: false
    label: { en_US: Callback URL, zh_Hans: 回调地址 }
    human_description: { en_US: Optional public webhook URL., zh_Hans: 可选公网回调地址。 }
    llm_description: Optional webhook for the final result.
    form: form
extra:
  python:
    source: tools/minimax_generate.py
