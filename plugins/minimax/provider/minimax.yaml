identity:
  author: "acedatacloud"
  name: "minimax"
  label:
    en_US: "MiniMax H3"
    zh_Hans: "MiniMax H3"
    pt_BR: "MiniMax H3"
    ja_JP: "MiniMax H3"
  description:
    en_US: "Generate videos via Ace Data Cloud Minimax Videos API."
    zh_Hans: "通过 Ace Data Cloud Minimax Videos API 生成视频。"
    pt_BR: "Gere vídeos via Ace Data Cloud Minimax Videos API."
