      en_US: Acquire a token from the Ace Data Cloud console.
      zh_Hans: 从 Ace Data Cloud 控制台获取 Token。
    url: https://platform.acedata.cloud/documents/minimax-videos

tools:
  - tools/minimax_generate.yaml
  - tools/minimax_task_retrieve.yaml

extra:
  python:
    source: provider/minimax.py
