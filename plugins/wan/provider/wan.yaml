identity:
  author: "acedatacloud"
  name: "wan"
  label:
    en_US: "Wan"
    zh_Hans: "通义万相 Wan"
    pt_BR: "Wan"
    ja_JP: "Wan"
  description:
    en_US: "Generate videos with the Ace Data Cloud Wan (Alibaba) Videos API."
    zh_Hans: "通过 Ace Data Cloud 通义万相 Wan API 生成视频。"
    pt_BR: "Gere vídeos com a API Ace Data Cloud Wan."
    ja_JP: "Ace Data Cloud Wan API で動画を生成します。"
  icon: "icon.jpg"
  icon_dark: "icon.jpg"

  tags:
    - videos
    - productivity

credentials_for_provider:
  acedata_bearer_token:
    type: secret-input
    required: true
    label:
      en_US: Ace Data Cloud Bearer Token
      zh_Hans: Ace Data Cloud Token
    placeholder:
      en_US: Paste your token (without "Bearer ")
      zh_Hans: 粘贴 Token（不需要带 Bearer）
    help:
      en_US: Acquire a token from the Ace Data Cloud console.
      zh_Hans: 从 Ace Data Cloud 控制台获取 Token。
    url: https://platform.acedata.cloud/documents/wan-integration

tools:
  - tools/wan_generate.yaml
  - tools/wan3_generate.yaml

extra:
  python:
    source: provider/wan.py
