identity:
  name: suno_generate_lyrics
  author: acedatacloud
  label:
    en_US: Suno Generate Lyrics
    zh_Hans: Suno 生成歌词
description:
  human:
    en_US: Generate lyrics with Ace Data Cloud Suno Lyrics API.
    zh_Hans: 通过 Ace Data Cloud Suno Lyrics API 生成歌词。
  llm: Generate lyrics from a prompt via Ace Data Cloud Suno Lyrics API.
output_schema:
  type: object
  properties:
    success: { type: boolean }
    error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
    task_id: { type: string }
    trace_id: { type: string }
    data:
      type: object
      additionalProperties: true
parameters:
  - name: prompt
    type: string
    required: true
    label: { en_US: Prompt, zh_Hans: 提示词 }
    human_description:
      en_US: Describe what the song is about.
      zh_Hans: 描述歌曲主题与风格。
    llm_description: Required. Provide a clear theme and vibe for the lyrics.
    form: llm
  - name: model
    type: select
    required: true
    default: default
    label: { en_US: Model, zh_Hans: 模型 }
    human_description:
      en_US: Select the lyrics generation model.
      zh_Hans: 选择歌词生成模型。
    llm_description: Required. Select default or remi-v1.
    form: form
    options:
      - value: default
        label: { en_US: Default, zh_Hans: 默认 }
      - value: remi-v1
        label: { en_US: remi-v1, zh_Hans: remi-v1 }
extra:
  python:
    source: tools/suno_generate_lyrics.py

