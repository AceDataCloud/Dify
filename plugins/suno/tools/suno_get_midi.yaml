identity:
  name: suno_get_midi
  author: acedatacloud
  label:
    en_US: Suno Get MIDI
    zh_Hans: Suno 获取 MIDI
description:
  human:
    en_US: Get MIDI data for an audio_id via Suno MIDI API.
    zh_Hans: 通过 Suno MIDI API 获取 audio_id 对应的 MIDI 数据。
  llm: Retrieve MIDI instruments/notes for a given audio_id.
output_schema:
  type: object
  properties:
    success: { type: boolean }
    error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
    task_id: { type: string }
    trace_id: { type: string }
    data:
      type: array
      items:
        type: object
        additionalProperties: true
parameters:
  - name: audio_id
    type: string
    required: true
    label: { en_US: Audio ID, zh_Hans: 音频ID }
    form: form
  - name: callback_url
    type: string
    required: false
    label: { en_US: Callback URL, zh_Hans: 回调地址 }
    form: form
  - name: async
    type: boolean
    required: false
    default: false
    label:
      en_US: Async
      zh_Hans: 异步模式
    human_description:
      en_US: Return a task_id immediately without a callback_url; poll the tasks endpoint for the result.
      zh_Hans: 立即返回 task_id，无需回调地址，通过任务查询接口轮询结果。
    llm_description: Optional. Set true to submit asynchronously and get a task_id to poll.
    form: form
extra:
  python:
    source: tools/suno_get_midi.py

