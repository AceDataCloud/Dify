identity:
  name: suno_generate_audios
  author: acedatacloud
  label:
    en_US: Suno Generate Audios
    zh_Hans: Suno 生成歌曲
description:
  human:
    en_US: Generate songs with Ace Data Cloud Suno Audios API.
    zh_Hans: 通过 Ace Data Cloud Suno Audios API 生成歌曲。
  llm: Generate songs via Ace Data Cloud Suno Audios API. Returns a task_id and song metadata (audio_url/image_url/lyric/etc).
output_schema:
  type: object
  properties:
    success: { type: boolean }
    error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      additionalProperties: true
    task_id: { type: string }
    trace_id: { type: string }
    data:
      type: array
      items:
        type: object
        additionalProperties: true
parameters:
  - name: action
    type: string
    required: true
    label: { en_US: Action, zh_Hans: 行为 }
    human_description:
      en_US: Generation action, e.g. generate/extend/cover/stems/all_stems/concat/remaster/mashup/replace_section/underpainting/overpainting/samples/inspo.
      zh_Hans: 生成行为，如 generate/extend/cover/stems/all_stems/concat/remaster/mashup/replace_section/underpainting/overpainting/samples/inspo。
    llm_description: Required. Typical values are generate, extend, upload_extend, cover, upload_cover, stems, all_stems, concat, remaster, artist_consistency, artist_consistency_vox, replace_section, underpainting, overpainting, mashup, samples, inspo. Use inspo to generate new music inspired by 1-4 reference audios (requires audio_urls).
    form: form
  - name: prompt
    type: string
    required: false
    label: { en_US: Prompt, zh_Hans: 提示词 }
    human_description:
      en_US: Used when custom is false.
      zh_Hans: custom 为 false 时使用。
    llm_description: Optional. Required when custom is false.
    form: llm
  - name: model
    type: string
    required: false
    label: { en_US: Model, zh_Hans: 模型 }
    human_description:
      en_US: Optional model name, e.g. chirp-v5.
      zh_Hans: 可选模型名，如 chirp-v5。
    form: form
  - name: custom
    type: boolean
    required: false
    label: { en_US: Custom Mode, zh_Hans: 自定义模式 }
    human_description:
      en_US: If true, use lyric/title/style instead of prompt.
      zh_Hans: 为 true 时使用 lyric/title/style 生成。
    form: form
  - name: instrumental
    type: boolean
    required: false
    label: { en_US: Instrumental, zh_Hans: 纯音乐 }
    human_description:
      en_US: Generate instrumental-only songs.
      zh_Hans: 生成纯音乐。
    form: form
  - name: lyric
    type: string
    required: false
    label: { en_US: Lyric, zh_Hans: 歌词 }
    human_description:
      en_US: Used when custom is true.
      zh_Hans: custom 为 true 时使用。
    form: llm
  - name: lyric_prompt
    type: string
    required: false
    label: { en_US: Lyric Prompt, zh_Hans: 歌词提示词 }
    human_description:
      en_US: Used when custom is true but lyric is empty.
      zh_Hans: custom 为 true 且 lyric 为空时，用于生成歌词。
    form: llm
  - name: title
    type: string
    required: false
    label: { en_US: Title, zh_Hans: 标题 }
    form: form
  - name: style
    type: string
    required: false
    label: { en_US: Style, zh_Hans: 风格 }
    form: form
  - name: style_negative
    type: string
    required: false
    label: { en_US: Negative Style, zh_Hans: 排除风格 }
    form: form
  - name: audio_id
    type: string
    required: false
    label: { en_US: Audio ID, zh_Hans: 音频ID }
    human_description:
      en_US: Required for extend/cover/stems/all_stems/concat/remaster and other edit actions.
      zh_Hans: extend/cover/stems/all_stems/concat/remaster 等编辑动作必填。
    form: form
  - name: audio_urls
    type: string
    required: false
    label: { en_US: Reference Audio URLs, zh_Hans: 参考音频URL }
    human_description:
      en_US: Required when action is inspo. 1 to 4 public audio URLs used as inspiration, comma-separated.
      zh_Hans: action 为 inspo 时必填。1 到 4 个公开音频 URL 作为灵感来源，使用英文逗号分隔。
    llm_description: Required when action is inspo. A comma-separated list of 1 to 4 publicly accessible reference audio URLs.
    form: llm
  - name: continue_at
    type: number
    required: false
    label: { en_US: Continue At (seconds), zh_Hans: 继续时间(秒) }
    human_description:
      en_US: Used for extend. Example 213.5 means continue at 3m33.5s.
      zh_Hans: 用于 extend。例 213.5 表示从 3 分 33.5 秒继续。
    form: form
  - name: audio_weight
    type: number
    required: false
    label: { en_US: Audio Weight, zh_Hans: 参考音频占比 }
    human_description:
      en_US: 0-1, larger means stronger reference.
      zh_Hans: 0-1，越大越依赖参考音频。
    form: form
  - name: persona_id
    type: string
    required: false
    label: { en_US: Persona ID, zh_Hans: Persona ID }
    human_description:
      en_US: Optional persona_id for artist consistency.
      zh_Hans: 可选 persona_id，用于歌手风格一致性。
    form: form
  - name: vocal_gender
    type: select
    required: false
    label: { en_US: Vocal Gender, zh_Hans: 人声性别 }
    human_description:
      en_US: Optional. f for female, m for male (v4.5+).
      zh_Hans: 可选。f 女声，m 男声（v4.5+）。
    form: form
    options:
      - value: f
        label: { en_US: Female, zh_Hans: 女声 }
      - value: m
        label: { en_US: Male, zh_Hans: 男声 }
  - name: variation_category
    type: select
    required: false
    label: { en_US: Variation Category, zh_Hans: 变奏类别 }
    human_description:
      en_US: Optional. Variation intensity for v5+ models (high/normal/subtle).
      zh_Hans: 可选。v5+ 模型变奏强度（high/normal/subtle）。
    llm_description: Optional. Only for chirp-v5+. Controls variation intensity.
    form: form
    options:
      - value: high
        label: { en_US: high, zh_Hans: 高 }
      - value: normal
        label: { en_US: normal, zh_Hans: 正常 }
      - value: subtle
        label: { en_US: subtle, zh_Hans: 轻微 }
  - name: weirdness
    type: number
    required: false
    label: { en_US: Weirdness, zh_Hans: 奇特度 }
    human_description:
      en_US: Optional. 0-1, controls generation weirdness.
      zh_Hans: 可选。0-1，控制生成奇特度。
    llm_description: Optional. Range 0-1.
    form: form
  - name: style_influence
    type: number
    required: false
    label: { en_US: Style Influence, zh_Hans: 风格影响 }
    human_description:
      en_US: Optional. 0-1, controls style influence strength.
      zh_Hans: 可选。0-1，控制风格影响强度。
    llm_description: Optional. Range 0-1.
    form: form
  - name: duration
    type: number
    required: false
    label: { en_US: Duration, zh_Hans: 时长 }
    human_description:
      en_US: Optional. Target length of the generated track in seconds, typically between 10 and 360. Mainly used in custom mode.
      zh_Hans: 可选。生成音乐的目标时长（秒），通常在 10 到 360 之间，主要用于自定义模式。
    llm_description: Optional. Target track length in whole seconds, typically 10-360. Mainly used when custom is true; support varies by model and action.
    form: form
  - name: callback_url
    type: string
    required: false
    label: { en_US: Callback URL, zh_Hans: 回调地址 }
    human_description:
      en_US: Optional callback URL for async notifications.
      zh_Hans: 可选回调地址，用于异步通知。
    form: form
  - name: async
    type: boolean
    required: false
    default: false
    label:
      en_US: Async
      zh_Hans: 异步模式
    human_description:
      en_US: Return a task_id immediately without a callback_url; poll the tasks endpoint for the result.
      zh_Hans: 立即返回 task_id，无需回调地址，通过任务查询接口轮询结果。
    llm_description: Optional. Set true to submit asynchronously and get a task_id to poll.
    form: form
extra:
  python:
    source: tools/suno_generate_audios.py
