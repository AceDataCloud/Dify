identity:
  name: seedream_generate_image
  author: acedatacloud
  label:
    en_US: Seedream Generate Image
    zh_Hans: Seedream 生成图片
description:
  human:
    en_US: Generate image(s) with Ace Data Cloud Seedream Images API.
    zh_Hans: 通过 Ace Data Cloud Seedream Images API 生成图片。
  llm: Generate image(s) from prompt via Ace Data Cloud Seedream Images API.
output_schema:
  type: object
  properties:
    success:
      type: boolean
    error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: true
    task_id:
      type: string
    trace_id:
      type: string
    data:
      type: array
      items:
        type: object
        properties:
          image_url:
            type: string
          prompt:
            type: string
          size:
            type: string
        additionalProperties: true
parameters:
- name: prompt
  type: string
  required: true
  label:
    en_US: Prompt
    zh_Hans: 提示词
  human_description:
    en_US: Text prompt used to generate the image(s).
    zh_Hans: 用于生成图片的提示词。
  llm_description: Describe the image you want to generate in detail.
  form: llm
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Choose a model whose capabilities match the selected parameters.
    zh_Hans: 请选择支持所选参数的模型。
  llm_description: Optional. Choose a supported Seedream model.
  form: form
  options:
  - value: doubao-seedream-5-0-pro-260628
    label:
      en_US: doubao-seedream-5-0-pro-260628
      zh_Hans: doubao-seedream-5-0-pro-260628
  - value: doubao-seedream-5-0-260128
    label:
      en_US: doubao-seedream-5-0-260128
      zh_Hans: doubao-seedream-5-0-260128
  - value: doubao-seedream-5-0-lite-260128
    label:
      en_US: doubao-seedream-5-0-lite-260128
      zh_Hans: doubao-seedream-5-0-lite-260128
  - value: doubao-seedream-4-0-250828
    label:
      en_US: doubao-seedream-4-0-250828 (default)
      zh_Hans: doubao-seedream-4-0-250828（默认）
  - value: doubao-seedream-4-5-251128
    label:
      en_US: doubao-seedream-4-5-251128
      zh_Hans: doubao-seedream-4-5-251128
- name: size
  type: select
  required: false
  label:
    en_US: Size
    zh_Hans: 尺寸
  human_description:
    en_US: Optional image size like 1K/2K/4K or 2048x2048 depending on model.
    zh_Hans: 可选图像尺寸，如 1K/2K/4K 或 2048x2048（取决于模型）。
  llm_description: Optional.
  form: form
  options:
  - value: 1K
    label:
      en_US: 1K
      zh_Hans: 1K
  - value: 1.5K
    label:
      en_US: 1.5K
      zh_Hans: 1.5K
  - value: 2K
    label:
      en_US: 2K
      zh_Hans: 2K
  - value: 3K
    label:
      en_US: 3K
      zh_Hans: 3K
  - value: 4K
    label:
      en_US: 4K
      zh_Hans: 4K
- name: sequential_image_generation
  type: select
  required: false
  label:
    en_US: Sequential image generation
    zh_Hans: 组图
  human_description:
    en_US: Optional. Use disabled/auto depending on model support.
    zh_Hans: 可选，根据模型支持情况填写 disabled/auto。
  llm_description: Optional.
  form: form
  options:
  - value: disabled
    label:
      en_US: disabled
      zh_Hans: disabled
  - value: auto
    label:
      en_US: auto
      zh_Hans: auto
- name: response_format
  type: select
  required: false
  label:
    en_US: Response format
    zh_Hans: 返回格式
  human_description:
    en_US: Optional. url or b64_json.
    zh_Hans: 可选，url 或 b64_json。
  llm_description: Optional.
  form: form
  options:
  - value: url
    label:
      en_US: url
      zh_Hans: url
  - value: b64_json
    label:
      en_US: b64_json
      zh_Hans: b64_json
- name: watermark
  type: boolean
  required: false
  label:
    en_US: Watermark
    zh_Hans: 水印
  human_description:
    en_US: Optional. Add watermark or not.
    zh_Hans: 可选，是否添加水印。
  llm_description: Optional.
  form: form
- name: output_format
  type: select
  required: false
  label:
    en_US: Output format
    zh_Hans: 输出格式
  human_description:
    en_US: 'Seedream 5.0 Pro/Lite: jpeg or png.'
    zh_Hans: Seedream 5.0 Pro/Lite 支持 jpeg 或 png。
  llm_description: Optional output image format.
  form: form
  options:
  - value: jpeg
    label:
      en_US: jpeg
      zh_Hans: jpeg
  - value: png
    label:
      en_US: png
      zh_Hans: png
- name: max_images
  type: number
  required: false
  label:
    en_US: Maximum images
    zh_Hans: 最大图片数
  human_description:
    en_US: 1-15 for sequential mode; inputs plus outputs must be at most 15.
    zh_Hans: 组图模式为 1-15；输入图与输出图总数不超过 15。
  llm_description: Sequential output maximum.
  form: form
- name: optimize_prompt_mode
  type: select
  required: false
  label:
    en_US: Prompt optimization
    zh_Hans: 提示词优化
  human_description:
    en_US: Pro supports standard/fast; Lite and 4.5 support standard.
    zh_Hans: Pro 支持 standard/fast；Lite 与 4.5 支持 standard。
  llm_description: Optional prompt optimization mode.
  form: form
  options:
  - value: standard
    label:
      en_US: standard
      zh_Hans: standard
  - value: fast
    label:
      en_US: fast
      zh_Hans: fast
- name: web_search
  type: boolean
  required: false
  label:
    en_US: Web search
    zh_Hans: 联网搜索
  human_description:
    en_US: Seedream 5.0 Lite only.
    zh_Hans: 仅 Seedream 5.0 Lite。
  llm_description: Enable Lite web search when current information matters.
  form: form
- name: callback_url
  type: string
  required: false
  label:
    en_US: Callback URL
    zh_Hans: 回调地址
  human_description:
    en_US: Optional. If provided, the task result will be POSTed to this URL.
    zh_Hans: 可选，若提供则任务完成后会回调该地址。
  llm_description: Optional.
  form: form
- name: async
  type: boolean
  required: false
  default: false
  label:
    en_US: Async
    zh_Hans: 异步模式
  human_description:
    en_US: Return a task_id immediately without a callback_url; poll the tasks endpoint
      for the result.
    zh_Hans: 立即返回 task_id，无需回调地址，通过任务查询接口轮询结果。
  llm_description: Optional. Set true to submit asynchronously and get a task_id to
    poll.
  form: form
extra:
  python:
    source: tools/seedream_generate.py
