identity:
  author: "acedatacloud"
  name: "fish"
  label:
    en_US: "Fish Audio"
    zh_Hans: "Fish 语音"
    pt_BR: "Fish Audio"
    ja_JP: "Fish Audio"
  description:
    en_US: "Synthesize speech audio with the Ace Data Cloud Fish Audio API."
    zh_Hans: "通过 Ace Data Cloud Fish Audio API 合成语音。"
    pt_BR: "Sintetize áudio de fala com a API Ace Data Cloud Fish Audio."
    ja_JP: "Ace Data Cloud Fish Audio API で音声を合成します。"
  icon: "icon.jpg"
  icon_dark: "icon.jpg"

  tags:
    - audio
    - productivity

credentials_for_provider:
  acedata_bearer_token:
    type: secret-input
    required: true
    label:
      en_US: Ace Data Cloud Bearer Token
      zh_Hans: Ace Data Cloud Token
    placeholder:
      en_US: Paste your token (without "Bearer ")
      zh_Hans: 粘贴 Token（不需要带 Bearer）
    help:
      en_US: Acquire a token from the Ace Data Cloud console.
      zh_Hans: 从 Ace Data Cloud 控制台获取 Token。
    url: https://platform.acedata.cloud/documents/fish-integration

tools:
  - tools/fish_generate.yaml

extra:
  python:
    source: provider/fish.py
