app:
  description: 输入一个热点话题，AI 搜索最新信息，生成配图和短视频，自动生成图文+视频自媒体内容
  icon: 📱
  icon_background: '#FFF3CD'
  mode: workflow
  name: 自媒体一键创作
  use_icon_as_answer_icon: false
dependencies:
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: acedatacloud/flux
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: acedatacloud/nano-banana
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: acedatacloud/serp
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: acedatacloud/veo
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: tool
      id: start-to-serp
      source: start_node
      sourceHandle: source
      target: serp_research
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: tool
        targetType: llm
      id: serp-to-writer
      source: serp_research
      sourceHandle: source
      target: article_writer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: tool
      id: writer-to-flux
      source: article_writer
      sourceHandle: source
      target: flux_cover
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: tool
        targetType: tool
      id: flux-to-nano
      source: flux_cover
      sourceHandle: source
      target: nano_thumbnail
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: tool
        targetType: tool
      id: nano-to-veo
      source: nano_thumbnail
      sourceHandle: source
      target: veo_short_video
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: tool
        targetType: llm
      id: veo-to-final
      source: veo_short_video
      sourceHandle: source
      target: final_package
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
      id: final-to-end
      source: final_package
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 话题/热点
          max_length: 500
          options: []
          required: true
          type: text-input
          variable: topic
        - label: 平台
          max_length: 200
          options:
          - 微信公众号
          - 小红书
          - 抖音
          - B站
          - Twitter/X
          required: false
          type: select
          variable: platform
      height: 90
      id: start_node
      position:
        x: 30
        y: 277
      positionAbsolute:
        x: 30
        y: 277
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 搜索最新资讯
        title: 热点搜索
        type: tool
        provider_id: acedatacloud/serp
        provider_type: plugin
        provider_name: serp
        tool_name: serp_google
        tool_label: Google Search
        tool_configurations: {}
        tool_parameters:
          query:
            type: mixed
            value: '{{#start_node.topic#}}'
          type:
            type: mixed
            value: news
          number:
            type: mixed
            value: '8'
      height: 90
      id: serp_research
      position:
        x: 334
        y: 277
      positionAbsolute:
        x: 334
        y: 277
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 根据搜索结果写文章
        title: 文章创作
        type: llm
        model:
          provider: openai
          name: gpt-4o
          mode: chat
        prompt_template:
        - role: system
          text: 'You are a top social media content creator. Based on the research results, create engaging content in Chinese.


            Output in EXACT format:

            TITLE: <catchy title, max 30 chars>

            COVER_PROMPT: <English prompt for a stunning cover image, photorealistic, eye-catching>

            THUMBNAIL_PROMPT: <English prompt for a square social media thumbnail, vibrant, text-overlay style>

            VIDEO_PROMPT: <English prompt for a short promotional video clip related to the topic>

            ARTICLE:

            <full article in Chinese, 500-800 words, engaging, informative, with emojis>

            TAGS: <5-8 hashtags in Chinese>

            '
        - role: user
          text: '话题: {{#start_node.topic#}}

            平台: {{#start_node.platform#}}

            搜索结果: {{#serp_research.text#}}

            '
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        context:
          enabled: false
          variable_selector: []
        structured_output:
          enabled: false
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      height: 90
      id: article_writer
      position:
        x: 638
        y: 277
      positionAbsolute:
        x: 638
        y: 277
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Flux 生成封面大图
        title: 封面大图
        type: tool
        provider_id: acedatacloud/flux
        provider_type: plugin
        provider_name: flux
        tool_name: flux_generate_image
        tool_label: Flux Generate Image
        tool_configurations: {}
        tool_parameters:
          prompt:
            type: mixed
            value: '{{#article_writer.text#}}'
          model:
            type: mixed
            value: flux-pro-1.1
          size:
            type: mixed
            value: 1920x1080
      height: 90
      id: flux_cover
      position:
        x: 942
        y: 177
      positionAbsolute:
        x: 942
        y: 177
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: NanoBanana 生成缩略图
        title: 社交缩略图
        type: tool
        provider_id: acedatacloud/nano-banana
        provider_type: plugin
        provider_name: nano-banana
        tool_name: nano_banana_generate_image
        tool_label: Nano Banana Generate Image
        tool_configurations: {}
        tool_parameters:
          prompt:
            type: mixed
            value: '{{#article_writer.text#}}'
          aspect_ratio:
            type: mixed
            value: '1:1'
      height: 90
      id: nano_thumbnail
      position:
        x: 942
        y: 327
      positionAbsolute:
        x: 942
        y: 327
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: Veo 生成短视频
        title: 短视频
        type: tool
        provider_id: acedatacloud/veo
        provider_type: plugin
        provider_name: veo
        tool_name: veo_generate_video
        tool_label: Veo Generate Video
        tool_configurations: {}
        tool_parameters:
          action:
            type: mixed
            value: text2video
          prompt:
            type: mixed
            value: '{{#article_writer.text#}}'
      height: 90
      id: veo_short_video
      position:
        x: 942
        y: 477
      positionAbsolute:
        x: 942
        y: 477
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 整合所有内容
        title: 内容打包
        type: llm
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
        prompt_template:
        - role: system
          text: "Assemble all generated content into a ready-to-publish self-media package in Chinese markdown.\n\nInclude:\n## \U0001F4F1 自媒体内容包\n### 文章标题 & 正文\n### 封面图 (URL)\n### 缩略图 (URL) \n### 短视频 (URL/ID)\n\
            ### Hashtags\n### 发布建议 (针对指定平台的最佳实践)\n"
        - role: user
          text: '平台: {{#start_node.platform#}}

            文章内容: {{#article_writer.text#}}

            封面结果: {{#flux_cover.text#}}

            缩略图结果: {{#nano_thumbnail.text#}}

            视频结果: {{#veo_short_video.text#}}

            '
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        context:
          enabled: false
          variable_selector: []
        structured_output:
          enabled: false
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
          exponential_backoff:
            enabled: false
            multiplier: 2
            max_interval: 10000
      height: 90
      id: final_package
      position:
        x: 1246
        y: 327
      positionAbsolute:
        x: 1246
        y: 327
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - final_package
          - text
          value_type: string
          variable: content_package
        selected: false
        title: 结束
        type: end
      height: 90
      id: end_node
      position:
        x: 1550
        y: 327
      positionAbsolute:
        x: 1550
        y: 327
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6
