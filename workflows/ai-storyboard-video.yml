        tool_label: Flux Generate Image
        tool_configurations: {}
        tool_parameters:
          prompt:
            type: mixed
            value: 'Extract SCENE 4 IMAGE_PROMPT from: {{#storyboard_llm.text#}}'
          model:
            type: mixed
            value: flux-pro-1.1
          size:
            type: mixed
            value: 1920x1080
      height: 90
      id: scene4_image
      position:
        x: 638
        y: 550
      positionAbsolute:
        x: 638
        y: 550
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 从图片生成结果中提取 URL 和视频提示词
        title: 提取图片URL
        type: llm
        model:
          provider: openai
          name: gpt-4o-mini
          mode: chat
        prompt_template:
        - role: system
          text: 'You receive storyboard info and 4 scene image generation results. Extract the image_url from each scene''s result data and pair it with a video motion prompt based on the CAMERA direction
            in the storyboard.


            Output EXACTLY in this format:

            SCENE1_URL: <url>

            SCENE1_VIDEO_PROMPT: <motion/camera prompt for video generation>

            SCENE2_URL: <url>

            SCENE2_VIDEO_PROMPT: <motion/camera prompt>

            SCENE3_URL: <url>

            SCENE3_VIDEO_PROMPT: <motion/camera prompt>

            SCENE4_URL: <url>

            SCENE4_VIDEO_PROMPT: <motion/camera prompt>

            '
        - role: user
          text: 'Storyboard:

            {{#storyboard_llm.text#}}


            Scene 1 Result:

            {{#scene1_image.text#}}


            Scene 2 Result:

            {{#scene2_image.text#}}


            Scene 3 Result:

            {{#scene3_image.text#}}


            Scene 4 Result:

            {{#scene4_image.text#}}

            '
        vision:
          enabled: false
          configs:
            variable_selector: []
        memory:
          enabled: false
          window:
            enabled: false
            size: 50
        context:
          enabled: false
          variable_selector: []
        structured_output:
          enabled: false
        retry_config:
          enabled: false
          max_retries: 1
          retry_interval: 1000
          exponential_backoff:
            enabled: false
