        title: 场景1 视频
        type: tool
        provider_id: acedatacloud/kling
        provider_type: plugin
        provider_name: kling
        tool_name: kling_generate_video
        tool_label: Kling Generate Video
        tool_configurations: {}
        tool_parameters:
          action:
            type: mixed
            value: image2video
          prompt:
            type: mixed
