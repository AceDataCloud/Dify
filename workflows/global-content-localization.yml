# 多语言内容全球化工作流
# 场景：内容出海，一键将内容本地化为多语言+多文化适配版本
# 流程：输入内容 → LLM 提取核心信息 → 并行翻译 N 种语言 → 为每种文化生成适配视觉素材 → 汇总
# 服务链：LLM (翻译+文化适配) → Flux (文化适配配图) → Iteration (并行多语言)

version: 0.1.0
kind: workflow

dependencies:
  - type: marketplace
    value:
      plugin_unique_identifier: acedatacloud/flux

workflow:
  conversation_variables: []
  environment_variables: []
  features: {}

  graph:
    viewport:
      x: 0
      y: 0
      zoom: 0.7

    edges:
      # Start → LLM Content Analyzer
      - id: start-to-analyzer
        source: start
        sourceHandle: source
        target: llm_content_analyzer
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: start
          targetType: llm
          isInIteration: false
          isInLoop: false

      # Analyzer → Code Parse
      - id: analyzer-to-parse
        source: llm_content_analyzer
        sourceHandle: source
        target: code_parse_content
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: llm
          targetType: code
          isInIteration: false
          isInLoop: false

      # Parse → Iteration (多语言本地化)
      - id: parse-to-iter-locales
        source: code_parse_content
        sourceHandle: source
        target: iteration_locales
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: code
          targetType: iteration
          isInIteration: false
          isInLoop: false

      # Inside Locale Iteration: Start → LLM Translator
      - id: locale-start-to-translator
        source: locale_iter_start
        sourceHandle: source
        target: llm_translator
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: iteration-start
          targetType: llm
          isInIteration: true
          isInLoop: false

      # Translator → Code Build Image Prompt
      - id: translator-to-img-prompt
        source: llm_translator
        sourceHandle: source
        target: code_build_img_prompt
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: llm
          targetType: code
          isInIteration: true
          isInLoop: false

      # Code Build → Flux Generate
      - id: img-prompt-to-flux
        source: code_build_img_prompt
        sourceHandle: source
        target: flux_cultural_image
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: code
          targetType: tool
          isInIteration: true
          isInLoop: false

      # Iteration → Code Final Assembly
      - id: iter-to-assembly
        source: iteration_locales
        sourceHandle: source
        target: code_final_assembly
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: iteration
          targetType: code
          isInIteration: false
          isInLoop: false

      # Assembly → End
      - id: assembly-to-end
        source: code_final_assembly
        sourceHandle: source
        target: end_node
        targetHandle: target
        type: custom
        zIndex: 0
        data:
          sourceType: code
          targetType: end
          isInIteration: false
          isInLoop: false

    nodes:
      # ============================================================
      # START
      # ============================================================
      - id: start
        type: custom
        position: { x: 0, y: 300 }
        width: 244
        height: 150
        data:
          type: start
          title: "内容全球化"
          variables:
            - variable: source_content
              label: 原始内容
              type: paragraph
              required: true
              max_length: 5000
            - variable: content_type
              label: 内容类型
              type: select
              required: true
              options:
                - "产品介绍"
                - "营销文案"
                - "博客文章"
                - "新闻稿"
                - "社交媒体帖文"
                - "APP 内文案"
            - variable: source_language
              label: 原始语言
              type: select
              required: true
              default: "zh"
              options:
                - "zh"
                - "en"
                - "ja"
                - "ko"
            - variable: target_markets
              label: 目标市场
              type: select
              required: true
              default: "global-5"
              options:
                - "global-5"
                - "asia-focus"
                - "europe-focus"
                - "americas-focus"
                - "full-global"
            - variable: generate_visuals
              label: 生成文化适配配图
              type: select
              required: true
              default: "yes"
              options:
                - "yes"
                - "no"

      # ============================================================
      # LLM: 内容分析 + 本地化策略
      # ============================================================
      - id: llm_content_analyzer
        type: custom
        position: { x: 350, y: 300 }
        width: 244
        height: 118
        data:
          type: llm
          title: "全球化策略师"
          model:
            provider: langgenius/openai/openai
            name: chatgpt-4o-latest
            mode: chat
            completion_params:
              temperature: 0.5
              max_tokens: 4000
          prompt_template:
            - role: system
              text: |
                你是一个资深的国际化 / 本地化专家。分析源内容，制定本地化策略。

                目标市场对应的语言列表：
                - global-5: ["en", "ja", "ko", "es", "de"]
                - asia-focus: ["en", "ja", "ko", "zh-tw", "th", "vi"]
                - europe-focus: ["en", "de", "fr", "es", "it", "pt"]
                - americas-focus: ["en", "es", "pt-br"]
                - full-global: ["en", "ja", "ko", "es", "de", "fr", "pt", "ar", "ru", "it"]

                返回 JSON：
                ```json
                {
                  "core_message": "内容核心信息提炼",
                  "tone": "文案调性",
                  "cultural_notes": {
                    "en": "English market: notes on cultural adaptation",
                    "ja": "Japanese market: notes...",
                    ...
                  },
                  "target_languages": ["en", "ja", "ko", ...],
                  "locale_configs": [
                    {
                      "lang": "en",
                      "lang_name": "English",
                      "market": "US/Global English",
                      "cultural_visual_hint": "Western corporate style, diverse people, modern office",
                      "adaptation_notes": "specific adaptation notes for this market"
                    },
                    ...
                  ]
                }
                ```
              jinja2_text: null
            - role: user
              text: ""
              jinja2_text: |
                源内容：
                {{ content }}

                内容类型：{{ content_type }}
                源语言：{{ source_lang }}
                目标市场：{{ target_markets }}
          prompt_config:
            jinja2_variables:
              - variable: content
                value_selector: [start, source_content]
              - variable: content_type
                value_selector: [start, content_type]
              - variable: source_lang
                value_selector: [start, source_language]
              - variable: target_markets
                value_selector: [start, target_markets]
          context:
            enabled: false
          vision:
            enabled: false

      # ============================================================
      # CODE: 解析本地化策略
      # ============================================================
      - id: code_parse_content
        type: custom
        position: { x: 700, y: 300 }
        width: 244
        height: 80
        data:
          type: code
          title: "解析策略"
          code_language: python3
          code: |
            import json
            import re

            def main(llm_output: str, source_content: str, content_type: str, generate_visuals: str) -> dict:
                json_match = re.search(r'```(?:json)?\s*(\{.*?\})\s*```', llm_output, re.DOTALL)
                if json_match:
                    raw = json_match.group(1)
                else:
                    json_match = re.search(r'\{.*\}', llm_output, re.DOTALL)
                    raw = json_match.group(0) if json_match else llm_output
                data = json.loads(raw)

                locale_configs = data.get("locale_configs", [])
                # Serialize each locale config as JSON string for iteration
                locale_items = []
                for lc in locale_configs:
                    lc["source_content"] = source_content
                    lc["content_type"] = content_type
                    lc["core_message"] = data.get("core_message", "")
                    lc["generate_visuals"] = generate_visuals
                    locale_items.append(json.dumps(lc, ensure_ascii=False))

                return {
                    "locale_items": locale_items,
                    "total_languages": len(locale_items),
                    "core_message": data.get("core_message", "")
                }
          variables:
            - variable: llm_output
              value_selector: [llm_content_analyzer, text]
            - variable: source_content
              value_selector: [start, source_content]
            - variable: content_type
              value_selector: [start, content_type]
            - variable: generate_visuals
              value_selector: [start, generate_visuals]
          outputs:
            locale_items:
              type: "array[string]"
            total_languages:
              type: number
            core_message:
              type: string

      # ============================================================
      # ITERATION: 逐语言本地化
      # ============================================================
      - id: iteration_locales
        type: custom
        position: { x: 1050, y: 150 }
        width: 900
        height: 400
        data:
          type: iteration
          title: "多语言并行本地化"
          desc: "每种目标语言：翻译 + 文化适配 + 配图"
          iterator_selector: [code_parse_content, locale_items]
          output_selector: [flux_cultural_image, text]
          is_parallel: true
          parallel_nums: 5
          error_handle_mode: continue-on-error
          flatten_output: false
          start_node_id: locale_iter_start

      - id: locale_iter_start
        type: custom
        position: { x: 1100, y: 300 }
        width: 100
        height: 50
        parentId: iteration_locales
        data:
          type: iteration-start
          title: "开始"
          isInIteration: true
          iteration_id: iteration_locales

      # --- LLM: 翻译 + 文化适配 ---
      - id: llm_translator
        type: custom
        position: { x: 1280, y: 270 }
        width: 244
        height: 118
        parentId: iteration_locales
        data:
          type: llm
          title: "AI 翻译+适配"
          isInIteration: true
          iteration_id: iteration_locales
          model:
            provider: langgenius/openai/openai
            name: chatgpt-4o-latest
            mode: chat
            completion_params:
              temperature: 0.5
              max_tokens: 3000
          prompt_template:
            - role: system
              text: |
                你是一个专业的翻译和文化适配专家。

                你会收到一个 JSON，包含原始内容和目标语言/市场信息。
                请将内容翻译并进行文化适配。

                返回 JSON：
                ```json
                {
                  "lang": "语言代码",
                  "lang_name": "语言名",
                  "translated_content": "翻译+适配后的完整内容",
                  "adaptation_summary": "适配说明",
                  "visual_prompt": "English prompt for culturally adapted image matching this market"
                }
                ```

                翻译规则：
                - 不是直译，而是意译 + 文化适配
                - 考虑目标文化的表达习惯
                - 保留核心信息，但调整修辞和例子
                - visual_prompt 要反映目标文化特色
              jinja2_text: null
            - role: user
              text: ""
              jinja2_text: |
                请处理这个本地化任务：
                {{ locale_config }}
          prompt_config:
            jinja2_variables:
              - variable: locale_config
                value_selector: [iteration_locales, item]
          context:
            enabled: false
          vision:
            enabled: false

      # --- Code: 构建配图 prompt ---
      - id: code_build_img_prompt
        type: custom
        position: { x: 1580, y: 270 }
        width: 200
        height: 80
        parentId: iteration_locales
        data:
          type: code
          title: "构建配图"
          isInIteration: true
          iteration_id: iteration_locales
          code_language: python3
          code: |
            import json
            import re

            def main(llm_output: str) -> dict:
                json_match = re.search(r'```(?:json)?\s*(\{.*?\})\s*```', llm_output, re.DOTALL)
                if json_match:
                    raw = json_match.group(1)
                else:
                    json_match = re.search(r'\{.*\}', llm_output, re.DOTALL)
                    raw = json_match.group(0) if json_match else llm_output
                data = json.loads(raw)
                return {
                    "visual_prompt": data.get("visual_prompt", "modern professional banner"),
                    "translated_content": data.get("translated_content", ""),
                    "lang": data.get("lang", ""),
                    "lang_name": data.get("lang_name", ""),
                    "locale_result_json": json.dumps(data, ensure_ascii=False)
                }
          variables:
            - variable: llm_output
              value_selector: [llm_translator, text]
          outputs:
            visual_prompt:
              type: string
            translated_content:
              type: string
            lang:
              type: string
            lang_name:
              type: string
            locale_result_json:
              type: string

      # --- Flux: 文化适配配图 ---
      - id: flux_cultural_image
        type: custom
        position: { x: 1830, y: 270 }
        width: 244
        height: 118
        parentId: iteration_locales
        data:
          type: tool
          title: "文化适配配图"
          isInIteration: true
          iteration_id: iteration_locales
          provider_type: builtin
          provider_name: acedatacloud/flux/flux
          provider_id: acedatacloud/flux/flux
          tool_name: flux_generate
          tool_label: Flux Generate
          is_team_authorization: true
          tool_configurations: {}
          tool_parameters:
            prompt:
              type: mixed
              value: "{{#code_build_img_prompt.visual_prompt#}}"
            size:
              type: constant
              value: "1024x1024"

      # ============================================================
      # CODE: 最终汇总
      # ============================================================
      - id: code_final_assembly
        type: custom
        position: { x: 2050, y: 300 }
        width: 244
        height: 80
        data:
          type: code
          title: "全球化内容汇总"
          code_language: python3
          code: |
            import json

            def main(locale_results: list, total_languages: int, core_message: str) -> dict:
                locales = []
                md = ["# 🌐 全球化内容包", f"\n**核心信息：** {core_message}", f"**本地化版本数：** {total_languages}\n"]

                for i, result in enumerate(locale_results or []):
                    if not result:
                        continue
                    # The iteration output is from flux_cultural_image (tool text)
                    # We need to get translation info from the intermediate code node
                    # In practice, we'd aggregate both. For now parse what we have.
                    image_url = ""
                    try:
                        data = json.loads(result)
                        items = data.get("data", [])
                        if isinstance(items, list) and items:
                            image_url = items[0].get("image_url", "")
                    except (json.JSONDecodeError, TypeError):
                        pass

                    locale_info = {
                        "index": i + 1,
                        "image_url": image_url
                    }
                    locales.append(locale_info)
                    md.append(f"### 语言版本 {i + 1}")
                    if image_url:
                        md.append(f"![配图]({image_url})")
                    md.append("")

                md.append(f"\n---\n共 {len(locales)} 个本地化版本已生成。")

                return {
                    "report": "\n".join(md),
                    "data_json": json.dumps({
                        "total": len(locales),
                        "locales": locales
                    }, ensure_ascii=False)
                }
          variables:
            - variable: locale_results
              value_selector: [iteration_locales, output]
            - variable: total_languages
              value_selector: [code_parse_content, total_languages]
            - variable: core_message
              value_selector: [code_parse_content, core_message]
          outputs:
            report:
              type: string
            data_json:
              type: string

      # ============================================================
      # END
      # ============================================================
      - id: end_node
        type: custom
        position: { x: 2400, y: 300 }
        width: 244
        height: 80
        data:
          type: end
          title: "全球化内容包"
          outputs:
            - variable: report
              value_selector: [code_final_assembly, report]
            - variable: data_json
              value_selector: [code_final_assembly, data_json]
